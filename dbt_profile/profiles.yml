# Machine-driven dbt profile for CommerceLens, used by the Airflow DAG
# (airflow/dags/commercelens_dag.py) via `dbt --profiles-dir`.
#
# Every connection field comes from an env var the DAG sets just before
# invoking dbt -- nothing here is hardcoded to Postgres or to any one
# environment. Which block gets used is controlled by DBT_TARGET (also set
# by the DAG, from an Airflow Variable), not by editing this file.
#
# This is deliberately a separate file from profiles_example.yml, which
# stays as the plain, human-oriented template for local/manual dbt use
# documented in the README. This file is the automation-facing one.
#
# Status: the `dev` (Postgres) target is what the Airflow DAG runs
# against today. The `snowflake` target has now been run for real --
# `dbt run && dbt test` against an actual Snowflake trial account,
# 20/20 models and 50/50 tests passing, output captured in
# ../results/dbt_snowflake_verification_output.txt. Three Postgres-only
# SQL constructs needed real fixes to get there: `generate_series` (no
# Snowflake equivalent -- replaced with a GENERATOR()-based date spine),
# the `~` regex operator (Snowflake uses RLIKE -- added the
# `regex_match()` macro in macros/cross_db_regex_match.sql to dispatch on
# `target.type`), and `DISTINCT ON` (not supported in Snowflake --
# replaced with QUALIFY + ROW_NUMBER() there). All three are
# target-conditional in the model SQL, so the Postgres path is byte-for-
# byte unchanged from what was already verified.
#
# One real scope boundary this did NOT close: the run above loaded the
# raw CSVs into Snowflake by hand (Snowflake's own upload wizard), not
# through the Airflow DAG's ingest_raw_data task, which is still
# Postgres-only (see commercelens_dag.py's module docstring). So: the
# dbt transformation layer is verified on Snowflake; a full Airflow-
# orchestrated Snowflake run still needs that ingestion task reworked
# for PUT + COPY INTO. Don't claim the orchestrated DAG itself runs on
# Snowflake -- only that dbt does, independent of Airflow.

commercelens:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:

    # Postgres -- real, tested, what the DAG runs against today.
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST') }}"
      user: "{{ env_var('DBT_PG_USER') }}"
      password: "{{ env_var('DBT_PG_PASSWORD', '') }}"
      port: "{{ env_var('DBT_PG_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('DBT_PG_DBNAME') }}"
      schema: "{{ env_var('DBT_PG_SCHEMA', 'dbt_dev') }}"
      threads: 4

    # Snowflake -- real, verified via a manual dbt run (see status note
    # above). Not yet wired through the Airflow DAG end to end.
    snowflake:
      type: snowflake
      account: "{{ env_var('DBT_SF_ACCOUNT') }}"
      user: "{{ env_var('DBT_SF_USER') }}"
      password: "{{ env_var('DBT_SF_PASSWORD', '') }}"
      role: "{{ env_var('DBT_SF_ROLE', '') }}"
      database: "{{ env_var('DBT_SF_DATABASE') }}"
      warehouse: "{{ env_var('DBT_SF_WAREHOUSE') }}"
      schema: "{{ env_var('DBT_SF_SCHEMA', 'dbt_dev') }}"
      threads: 4
