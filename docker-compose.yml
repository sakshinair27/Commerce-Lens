version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: commercelens_pg
    environment:
      POSTGRES_USER: commercelens
      POSTGRES_PASSWORD: commercelens
      POSTGRES_DB: commercelens
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./data:/data:ro
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: commercelens_metabase
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: commercelens
      MB_DB_PORT: 5432
      MB_DB_USER: commercelens
      MB_DB_PASS: commercelens
      MB_DB_HOST: postgres

volumes:
  pg_data:
