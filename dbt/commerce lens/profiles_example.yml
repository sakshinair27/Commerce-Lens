# Example dbt profile for CommerceLens. Copy to ~/.dbt/profiles.yml (or point
# DBT_PROFILES_DIR at a directory containing this file) and fill in your own
# Postgres connection details.
#
# Note: the /scripts/run_dbt_verification.py script in this repo generates
# this file automatically (pointed at a real, ephemeral pgserver instance)
# so `dbt run` / `dbt test` can be executed end-to-end without Docker.

commercelens:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      user: postgres
      password: "{{ env_var('DBT_PG_PASSWORD', '') }}"
      port: 5432
      dbname: postgres
      schema: dbt_dev
      threads: 4
