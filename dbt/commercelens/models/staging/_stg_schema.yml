version: 2

models:
  - name: stg_customers
    description: Deduped, cleaned customer records (one row per customer_id).
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email
        tests: [unique]

  - name: stg_categories
    description: Product category lookup, self-referencing on parent_category_id.
    columns:
      - name: category_id
        tests: [not_null, unique]

  - name: stg_products
    description: Cleaned product catalog with numeric unit_price and boolean is_active.
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: category_id
        tests:
          - relationships:
              to: ref('stg_categories')
              field: category_id
              severity: warn   # a handful of raw rows reference retired category_ids
      - name: unit_price
        tests:
          - non_negative_number:
              config:
                severity: warn

  - name: stg_orders
    description: One row per source order with a real parsed order_date.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'delivered', 'cancelled', 'returned']

  - name: stg_order_items
    description: One row per line item with a computed line_total.
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_products')
              field: product_id

  - name: stg_returns
    description: One row per return record tied to an order_item.
    columns:
      - name: return_id
        tests: [not_null, unique]
      - name: order_item_id
        tests:
          - relationships:
              to: ref('stg_order_items')
              field: order_item_id
